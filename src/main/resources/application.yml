spring:
  application:
    name: payment-reliability-lab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:55432}/${POSTGRES_DB:payment_lab}}
    username: ${POSTGRES_USER:payment_lab}
    password: ${POSTGRES_PASSWORD:payment_lab_local}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      validation-timeout: 1000
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    template:
      observation-enabled: true
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      observation-enabled: true

payment:
  events:
    enabled: ${EVENTS_ENABLED:true}
    topic: ${PAYMENT_EVENTS_TOPIC:payments.received.v1}
    consumer-group: ${PAYMENT_EVENTS_CONSUMER_GROUP:payment-projection-v1}
    acknowledgement-timeout: ${PAYMENT_EVENTS_ACK_TIMEOUT:3s}
    lock-timeout: ${PAYMENT_EVENTS_LOCK_TIMEOUT:30s}
    batch-size: ${PAYMENT_EVENTS_BATCH_SIZE:25}
    relay-interval: ${PAYMENT_EVENTS_RELAY_INTERVAL:500ms}
    relay-initial-delay: ${PAYMENT_EVENTS_RELAY_INITIAL_DELAY:1s}
  provider:
    base-url: ${PAYMENT_PROVIDER_BASE_URL:http://localhost:8080}
    connect-timeout: ${PAYMENT_PROVIDER_CONNECT_TIMEOUT:300ms}
    read-timeout: ${PAYMENT_PROVIDER_READ_TIMEOUT:750ms}
    max-attempts: ${PAYMENT_PROVIDER_MAX_ATTEMPTS:3}
    retry-wait: ${PAYMENT_PROVIDER_RETRY_WAIT:150ms}
    failure-rate-threshold: ${PAYMENT_PROVIDER_FAILURE_RATE_THRESHOLD:50}
    minimum-calls: ${PAYMENT_PROVIDER_MINIMUM_CALLS:4}
    sliding-window-size: ${PAYMENT_PROVIDER_SLIDING_WINDOW_SIZE:4}
    open-state-wait: ${PAYMENT_PROVIDER_OPEN_STATE_WAIT:10s}
    consumer-group: ${PAYMENT_PROVIDER_CONSUMER_GROUP:payment-provider-v1}
    dead-letter-topic: ${PAYMENT_PROVIDER_DLT:payments.received.v1.dlt}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${OTEL_TRACES_EXPORT_ENABLED:true}
  opentelemetry:
    resource-attributes:
      deployment.environment: ${DEPLOYMENT_ENVIRONMENT:local}

logging:
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT:ecs}
