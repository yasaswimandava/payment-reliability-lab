name: payment-reliability-lab

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payment_lab}
      POSTGRES_USER: ${POSTGRES_USER:-payment_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info
    ports:
      - "127.0.0.1:${KAFKA_PORT:-19092}:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  redpanda-data:
